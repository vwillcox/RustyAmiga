[package]
name = "amiga"
version = "0.1.0"
edition = "2021"
description = "Commodore Amiga emulator"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
png = "0.17"
winit = "0.30"
pixels = "0.15"
cpal = "0.15"
gilrs = "0.11"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
debug = 1
lto = "thin"

[profile.dev]
opt-level = 2
